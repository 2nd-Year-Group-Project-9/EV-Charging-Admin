<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                        teal: {
                            "50": "#e8eaf6",
                            "100": "#c5cae9",
                            "200": "#9fa8da",
                            "300": "#7986cb",
                            "400": "#5c6bc0",
                            "500": "#1A2FA0",
                            "600": "#1565c0",
                            "700": "#0d47a1",
                            "800": "#1a237e",
                            "900": "#0f172a",
                            "950": "#050b30",
                        },

                    "primary": "#1A2FA0",
                    "background": "#F0F4F8",
                    "primary-container": "#2A3EB1",
                    "on-surface": "#191c1d",
                    "on-surface-variant": "#3e494a",
                    "surface-container-highest": "#D0E1EE",
                    "surface-container-lowest": "#ffffff"
            },
            "fontFamily": {
                    "headline": ["Inter", "sans-serif"],
                    "body": ["Inter", "sans-serif"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary-fixed-dim">
<div class="flex min-h-screen">
<!-- SideNavBar -->
<aside class="hidden lg:flex flex-col h-screen w-64 fixed left-0 top-0 bg-slate-100 dark:bg-slate-950 p-4 gap-2 border-r-0">
<div class="mb-6 px-4 py-2">
<span class="text-teal-900 dark:text-teal-100 font-black block">Plug Me</span>
<span class="text-xs text-slate-500 uppercase tracking-widest font-semibold">Energy Management</span>
</div>
<nav class="flex-1 space-y-1">
<a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:text-teal-500 hover:translate-x-1 transition-transform duration-200 whitespace-nowrap" href="dashboard.html">
<span class="material-symbols-outlined shrink-0">dashboard</span>
<span class="text-sm font-semibold tracking-wide uppercase opacity-100 lg:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Dashboard</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-teal-700 dark:text-teal-300 bg-white dark:bg-slate-900 rounded-lg shadow-sm font-bold whitespace-nowrap" href="stations.html">
<span class="material-symbols-outlined shrink-0">ev_station</span>
<span class="text-sm font-semibold tracking-wide uppercase opacity-100 lg:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Charging Stations</span>
</a>
<a href="appointments.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:text-teal-500 hover:translate-x-1 transition-transform duration-200 whitespace-nowrap">
<span class="material-symbols-outlined shrink-0">calendar_month</span>
<span class="text-sm font-semibold tracking-wide uppercase opacity-100 lg:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Appointments</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:text-teal-500 hover:translate-x-1 transition-transform duration-200 whitespace-nowrap" href="notifications.html">
<span class="material-symbols-outlined shrink-0">notifications</span>
<span class="text-sm font-semibold tracking-wide uppercase opacity-100 lg:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Notifications</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:text-teal-500 hover:translate-x-1 transition-transform duration-200 whitespace-nowrap" href="#">
<span class="material-symbols-outlined shrink-0">bolt</span>
<span class="text-sm font-semibold tracking-wide uppercase opacity-100 lg:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Energy Grid</span>
</a>
</nav>
<div class="mt-auto pt-4 space-y-1 border-t border-slate-200/50">
<a class="flex items-center gap-3 px-4 py-3 text-slate-600 dark:text-slate-400 hover:text-teal-500 hover:translate-x-1 transition-transform duration-200 logout-btn whitespace-nowrap" href="#">
<span class="material-symbols-outlined shrink-0">logout</span>
<span class="text-sm font-semibold tracking-wide uppercase opacity-100 lg:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Logout</span>
</a>
</div>
</aside>
<!-- Main Content -->
<main class="lg:ml-20 transition-all duration-300 flex-1 flex flex-col min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-4xl font-extrabold font-headline text-on-surface tracking-tight mb-8">Configure Station</h1>
        <div class="bg-surface-container-lowest p-8 rounded-3xl shadow-sm border border-slate-100">
            <p class="text-slate-500 italic">Station configuration form placeholder...</p>
            <button class="mt-8 px-8 py-2.5 rounded-full font-semibold text-white bg-gradient-to-br from-primary to-primary-container shadow-lg shadow-primary/20 hover:scale-[1.02] transition-transform">Save Configuration</button>
        </div>
    </div>
</main>
</div>
<script type="module" src="../assets/js/auth.js"></script>
<script type="module">
    import { Auth } from '../assets/js/auth.js';
    const user = Auth.getCurrentUser();
    if (!user || user.role !== 'admin') {
        window.location.href = '../auth/login.html';
    }
    if (user.status !== 'approved') {
        window.location.href = 'dashboard.html';
    }
    document.querySelectorAll('.logout-btn').forEach(btn => {
        btn.onclick = (e) => {
            e.preventDefault();
            Auth.logout();
        };
    });
    document.querySelector('button.bg-gradient-to-br').onclick = () => {
        alert('Station configuration saved successfully!');
        window.location.href = 'stations.html';
    };
</script>
</body></html>
